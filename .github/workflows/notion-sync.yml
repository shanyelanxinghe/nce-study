name: 自建双向同步·稳定无循环版
on:
  workflow_dispatch
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-description
    steps:
      - uses: actions/checkout@v4

      - name: 安装环境
        run: sudo apt update && apt install -y git python3 && pip install requests notion2md notion-client

      - name: 双向精准同步
        shell: bash
        env:
          NOTION_TOKEN: ${{secrets.NOTION}}
          NOTION_PAGE_ID: ${{secrets.PAGE}}
        run: |
          python3 <<EOF
          import os
          from notion2md import NotionToMarkdown
          from notion2md.utils import export_markdown

          page_id = os.environ["NOTION_PAGE_ID"]
          ntm = NotionToMarkdown(page_id=page_id)
          md_text = ntm.to_markdown()

          file = "笔记文档.md"
          local = ""
          if os.path.exists(file):
              with open(file,'r',encoding='utf-8') as f:
                  local = f.read()

          if local.strip() != md_text.strip():
              if len(local) > len(md_text):
                  import requests
                  url=f"https://api.notion.com/v1/blocks/{page_id}/children"
                  head={"Authorization":"Bearer "+os.environ["NOTION_TOKEN"],"Notion-Version":"2022-06-28"}
                  requests.delete(url,headers=head)
                  requests.post(url,headers=head,json={"children":[{"type":"paragraph","rich_text":[{"text":{"content":local}}]} })
              else:
                  with open(file,'w',encoding='utf-8') as f:f.write(md_text)
          EOF

      - name: git提交
        run: |
          git config user.name 同步机器人
          git config user.email robot@github.com
          git add .
          git commit -m 笔记自动同步 || true
          git push || true
