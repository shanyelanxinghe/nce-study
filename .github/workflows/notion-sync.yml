name: Sync Notion to GitHub
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Call Notion API
        run: |
          curl "https://api.notion.com/v1/pages/${{ secrets.NOTION_PAGE_ID }}" \
          -H "Authorization: Bearer ${{ secrets.NOTION_API_KEY }}" \
          -H "Notion-Version: 2022-06-28" > page.json

      - name: Push File
        run: |
          git config user.name bot
          git config user.email bot@github.com
          git add .
          git commit -m "sync" || true
          git push
