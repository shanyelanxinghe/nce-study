name: 2026双向-Notion⇄GitHub 全空间自动扫描同步
on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update && sudo apt-get install -y python3 python3-pip
          pip install notion-client

      - name: 写入同步脚本（Base64编码，彻底避坑）
        run: |
          echo "" | base64 -d > sync_all.py

      - name: 执行同步脚本
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 sync_all.py

      - name: Git提交
        run: |
          git config --global user.name "Notion Sync Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "全空间扫描完成 $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
