name: 双向互通同步 Noti ↔ Github
on:
  workflow_dispatch
  schedule:
    - cron: '0 0 * * *'
permissions: write-all

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          pip install notion-client python-frontmatter

      - name: 双向读写同步
        env:
          NOTION_TOKEN: ${{secrets.NOTION_TOKEN}}
          NOTION_PAGE_ID: ${{secrets.NOTION_PAGE_ID}}
        run: |
          python3 <<EOF
          import os
          import frontmatter
          from pathlib import Path
          from notion_client import Client

          notion = Client(auth=os.getenv("NOTION_TOKEN"))
          page_id = os.getenv("NOTION_PAGE_ID")
          md_path = Path("content.md")

          # 读取Notion内容
          def get_notion():
              blocks = notion.blocks.children.list(block_id=page_id)["results"]
              text = ""
              for b in blocks:
                  if b["type"] == "paragraph":
                      text += "".join([t.plain_text for t in b.get("rich_text",[])]) + "\n\n"
              return text.strip()

          # 写入Notion
          def set_notion(content):
              notion.blocks.children.append(page_id, children=[{"paragraph":{"rich_text":[{"text":{"content":content}}]}}))

          # 两边对比更新
          git_md = md_path.read_text(encoding="utf-8") if md_path.exists() else ""
          notion_text = get_notion()

          # Notion内容更新GitHub
          if notion_text and notion_text != git_md:
              md_path.write_text(notion_text, encoding="utf-8")
              os.system("git config user.name bot && git config user.email bot@qq.com")
              os.system("git add . && git commit -m双向同步更新 && git push")

          # GitHub内容更新Notion
          elif git_md and git_md != notion_text:
              set_notion(git_md)

          print("双向同步完成")
          EOF
