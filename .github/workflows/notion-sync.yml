name: Notion ⇄ GitHub 双向同步
on:
  schedule:
    - cron: "0 * * * *"  # 每小时自动同步一次（可选，也可以保留手动触发）
  push:
    branches: [ main ]  # 代码push到main时触发（可选）
  workflow_dispatch:    # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v3

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: 安装依赖
        run: |
          pip install notion-client

      - name: 运行同步脚本
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NCE_PAGE_ID: ${{ secrets.NCE_PAGE_ID }}
          WEEKLY_PAGE_ID: ${{ secrets.WEEKLY_PAGE_ID }}
          DESKTOP_PAGE_ID: ${{ secrets.DESKTOP_PAGE_ID }}
          MONTHLY_PAGE_ID: ${{ secrets.MONTHLY_PAGE_ID }}
          INCOME_PAGE_ID: ${{ secrets.INCOME_PAGE_ID }}
          EXPENSES_PAGE_ID: ${{ secrets.EXPENSES_PAGE_ID }}
        run: python sync.py

      - name: 配置 Git 并提交文件
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "自动同步 Notion 内容生成 MD 文件" || echo "没有文件变化"
          git push origin main
