name: 2026双向-Notion⇄GitHub互通同步
on:
  workflow_dispatch
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装Python环境
        run: |
          sudo apt-get update && sudo apt-get install -y python3 python3-pip

      - name: 安装Notion官方SDK
        run: pip install notion-client

      - name: 整洁排版双向对比同步
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: |
          python3 <<EOF
          import os
          from notion_client import Client

          api_key = os.getenv('NOTION_TOKEN')
          page_id = os.getenv('NOTION_PAGE_ID')
          notion = Client(auth=api_key)

          # 读取github文档
          file = "notion-sync.md"
          github_md = ""
          if os.path.exists(file):
              with open(file,"r",encoding="utf-8") as f:
                  github_md = f.read().replace("# 笔记整洁同步\n\n","").strip()

          # 读取notion内容
          blocks = notion.blocks.list(page_id)["results"]
          notion_text = ""
          for b in blocks:
              if b["type"]=="paragraph" and b["paragraph"]["rich_text"]:
                  notion_text += b["paragraph"]["rich_text"][0]["text"]["content"] + "\n\n"
          notion_text = notion_text.strip()

          # 不一样才同步，杜绝循环
          if github_md != notion_text:
              # github更新写入notion
              if len(github_md) > len(notion_text):
                  for b in blocks:
                      notion.blocks.delete(b["id"])
                  notion.blocks.children.append(page_id,children=[{
                      "type":"paragraph",
                      "rich_text":[{"text":{"content":github_md}}]
                  }])
              # notion更新写入github
              else:
                  with open(file,"w",encoding="utf-8") as f:
                      f.write("# 笔记整洁同步\n\n"+notion_text)
          EOF

      - name: Git提交
        run: |
          git config user.name 同步机器人
          git config user.email bot@qq.com
          git add notion-sync.md
          if git diff --quiet;then echo 无需提交;else git commit -m整洁排版双向同步;git push;fi
