name: Notion ⇄ GitHub 双向同步（单文件覆盖+全内容）
on:
  workflow_dispatch:  # 手动触发
  push:               # 代码push时触发
  schedule:
    - cron: '0 0 * * *'  # 每天凌晨自动同步

permissions:
  contents: write  # 必须有写权限，才能自动提交文件

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取完整历史，避免Git冲突

      - name: 安装Python和依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          pip install notion-client

      - name: 运行双向同步脚本
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          WEEKLY_PAGE_ID: ${{ secrets.WEEKLY_PAGE_ID }}
          DESKTOP_PAGE_ID: ${{ secrets.DESKTOP_PAGE_ID }}
          MONTHLY_PAGE_ID: ${{ secrets.MONTHLY_PAGE_ID }}
        run: python3 sync.py  # 脚本内已包含Git提交，这里只运行即可
