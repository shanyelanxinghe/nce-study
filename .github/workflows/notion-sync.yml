name: 2026双向-Notion⇄GitHub最终稳定完美版
on:
  workflow_dispatch
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装Python运行环境
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip

      - name: 安装Notion官方稳定接口库
        run: pip install notion-client

      - name: 双向精准对齐·整洁排版同步
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: |
          python3 <<EOF
          import os
          from notion_client import Client

          # 读取密钥信息
          api_token = os.getenv("NOTION_TOKEN")
          page_id = os.getenv("NOTION_PAGE_ID")
          notion = Client(auth=api_token)

          # 文档文件名固定
          file_name = "notion笔记合集.md"

          # 读取GitHub本地排版内容
          github_text = ""
          if os.path.exists(file_name):
              with open(file_name, "r", encoding="utf-8") as f:
                  github_text = f.read().replace("# Notion 每日笔记同步\n\n", "").strip()

          # 规整读取Notion段落文字
          block_list = notion.blocks.children.list(block_id=page_id)["results"]
          notion_text = ""
          for item in block_list:
              if item["type"] == "paragraph":
                  text_info = item["paragraph"]
                  if text_info["rich_text"]:
                      notion_text += text_info["rich_text"][0]["text"]["content"] + "\n\n"
          notion_text = notion_text.strip()

          # 内容不一致才执行同步 彻底杜绝循环死链
          if github_text != notion_text:

              # GitHub文档更新 → 整洁写入Notion页面
              if len(github_text) > len(notion_text):
                  for block in block_list:
                      notion.blocks.delete(block_id=block["id"])
                  notion.blocks.children.append(
                      block_id=page_id,
                      children=[{
                          "type": "paragraph",
                          "rich_text": [{
                              "type": "text",
                              "text": {"content": github_text}
                          }]
                      }]
                  )
                  print("✅ GitHub内容规整同步至Notion完成")

              # Notion笔记更新 → 美观排版写入GitHub
              else:
                  with open(file_name, "w", encoding="utf-8") as f:
                      f.write("# Notion 每日笔记同步\n\n" + notion_text)
                  print("✅ Notion笔记美观排版同步GitHub完成")

          else:
              print("📄 两端内容一致，无需重复同步")
          EOF

      - name: Git提交归档推送
        run: |
          git config --global user.name 笔记同步机器人
          git config --global user.email sync-bot@github.com
          git add notion笔记合集.md
          if git diff --quiet; then
              echo 无内容变动，跳过提交
          else
              git commit -m 【整洁排版】双向笔记自动归档更新
              git push
          fi
