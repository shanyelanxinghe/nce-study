name: 2026双向-Notion⇄GitHub 全空间自动扫描同步
on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update && sudo apt-get install -y python3 python3-pip
          pip install notion-client

      - name: 全空间自动扫描同步脚本
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          cat > sync_all.py << 'EOF'
import os
from notion_client import Client

api_key = os.getenv('NOTION_TOKEN')
notion = Client(auth=api_key)

def get_all_accessible_pages():
    """获取所有你有权限访问的页面（不限定父子关系）"""
    all_pages = []
    # 搜索所有页面（包括独立页面、子页面）
    results = notion.search(filter={"property": "object", "value": "page"}).get("results", [])
    for page in results:
        # 只取有标题的页面
        title = page.get("properties", {}).get("title", {}).get("title", [{}])[0].get("plain_text", "未命名页面")
        all_pages.append({
            "id": page["id"],
            "title": title
        })
    return all_pages

def sync_page_content(page_id, page_title):
    """同步单个页面的内容到 GitHub 本地文件"""
    blocks = notion.blocks.children.list(block_id=page_id).get("results", [])
    notion_text = ""
    for b in blocks:
        if b["type"] == "paragraph":
            text = b["paragraph"]["rich_text"][0]["text"]["content"] if b["paragraph"]["rich_text"] else ""
            notion_text += text + "\n\n"

    # 写入 GitHub 本地文件（按页面标题命名）
    filename = f"notion-sync-{page_title.replace(' ', '_').replace('/', '-')}.md"
    with open(filename, "w", encoding="utf-8") as f:
        f.write(f"# {page_title}\n\n{notion_text}")
    print(f"✅ 页面 '{page_title}' 已同步到 {filename}")

def main():
    pages = get_all_accessible_pages()
    print(f"🔍 发现 {len(pages)} 个可访问页面")
    for page in pages:
        sync_page_content(page["id"], page["title"])

if __name__ == "__main__":
    main()
EOF

          python3 sync_all.py

      - name: Git自动提交推送
        run: |
          git config --global user.name "Notion Sync Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "双向自动同步更新 $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
