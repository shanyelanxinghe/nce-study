name: 2026双向-Notion⇄GitHub 全空间自动扫描同步
on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update && sudo apt-get install -y python3 python3-pip
          pip install notion-client

      - name: 写入同步脚本（base64 编码，避免 YAML 语法错误）
        run: |
          echo "$(cat << 'EOF' | base64 -w0
import os
from notion_client import Client

# 初始化 Notion 客户端
api_key = os.getenv('NOTION_TOKEN')
notion = Client(auth=api_key)

def get_all_accessible_pages():
    """获取所有你有权限的页面（不限定父子关系）"""
    pages = []
    response = notion.search(filter={"property": "object", "value": "page"})
    for page in response.get("results", []):
        # 只保留你有权限操作的页面（避免只读共享页）
        if page.get("parent", {}).get("workspace") or page.get("parent", {}).get("page_id"):
            pages.append({
                "id": page["id"],
                "title": page.get("properties", {}).get("title", {}).get("title", [{}])[0].get("plain_text", "未命名页面")
            })
    return pages

# 主逻辑：打印所有页面 ID 和标题
if __name__ == "__main__":
    pages = get_all_accessible_pages()
    print(f"共找到 {len(pages)} 个可操作页面：")
    for p in pages:
        print(f"ID: {p['id']} | 标题: {p['title']}")
EOF
          )" | base64 -d > sync_all.py

      - name: 运行同步脚本
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 sync_all.py
