name: 2026双向-Notion⇄GitHub 全空间自动扫描同步
on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update && sudo apt-get install -y python3 python3-pip
          pip install notion-client

      - name: 全空间自动扫描同步脚本
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          # 保留你原来的页面 ID，用于兼容旧逻辑（可选，可不删）
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: |
          cat > sync_all.py << 'EOF'
          import os
          import json
          from notion_client import Client

          notion = Client(auth=os.getenv('NOTION_TOKEN'))

          def get_all_accessible_pages():
              """获取所有你有权限访问的页面（包括独立页面）"""
              pages = []
              # 使用 search 接口，过滤出所有页面
              results = notion.search(filter={"property": "object", "value": "page"}).get("results", [])
              for page in results:
                  # 只取你有权限的页面（Integration 可访问）
                  if page.get("parent", {}).get("workspace") or page.get("parent", {}).get("page_id"):
                      title = page.get("properties", {}).get("title", {}).get("title", [{}])[0].get("plain_text", "未命名页面")
                      pages.append({
                          "id": page["id"],
                          "title": title
                      })
              return pages

          def sync_page(page_id, title):
              """同步单个页面：读取 Notion → 写入 GitHub；或反向"""
              # 1. 读取 GitHub 本地文件（按页面标题命名）
              filename = f"notion-{title.replace('/', '_').replace(' ', '-')}.md"
              github_md = ""
              if os.path.exists(filename):
                  with open(filename, "r", encoding="utf-8") as f:
                      github_md = f.read()

              # 2. 读取 Notion 页面内容
              blocks = notion.blocks.children.list(block_id=page_id).get("results", [])
              notion_text = ""
              for b in blocks:
                  if b["type"] == "paragraph":
                      t = b["paragraph"]["rich_text"][0]["text"]["content"] if b["paragraph"]["rich_text"] else ""
                      notion_text += t + "\n\n"

              # . 双向判断：哪边新就同步哪边
        3      if len(github_md) > len(notion_text):
                  # GitHub 更新 → 同步回 Notion
                  # 清空原内容
                  for b in blocks:
                      notion.blocks.delete(block_id=b["id"])
                  # 写入 GitHub 内容
                  notion.blocks.children.append(
                      block_id=page_id,
                      children=[{"type":"paragraph","paragraph":{"rich_text":[{"type":"text","text":{"content":github_md}}]}}]
                  )
                  print(f"✅ GitHub修改已同步回Notion: {title}")
              else:
                  # Notion 更新 → 同步到 GitHub
                  with open(filename, "w", encoding="utf-8") as f:
                      f.write(f"# {title}\n\n{notion_text}")
                  print(f"✅ Notion内容已同步到GitHub: {title}")

          # 主程序
          all_pages = get_all_accessible_pages()
          print(f"🔍 发现 {len(all_pages)} 个可同步页面:")
          for p in all_pages:
              print(f"  - {p['title']} ({p['id']})")
              sync_page(p['id'], p['title'])

          EOF

          python3 sync_all.py

      - name: Git自动提交推送
        run: |
          git config --global user.name "Notion Sync Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo 无变更，跳过提交
          else
            git commit -m "双向自动同步更新 $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
