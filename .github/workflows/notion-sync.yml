name: 自建双向同步·无循环稳定版
on:
  workflow-guard: never
  workflow_dispatch:
  schedule:
    cron: 0 8 * * *

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 环境安装
        run: sudo apt update && apt install -y git python3 && pip install notion2md notion-client

      - name: 双向无损排版同步
        shell: bash
        run: |
          python3 <<EOF
          import os
          from notion2md import NotionToMarkdown
          from notion2md.utils import export_markdown
          from notion2md.converter import block_to_markdown

          page_id = os.environ['PAGE']
          ntm = NotionToMarkdown(page_id=page_id)
          md_blocks = ntm.get_blocks()
          pretty_md = ntm.to_markdown()

          # 本地文件读写
          file = "笔记归档.md"
          local = ""
          if os.path.exists(file):
              with open(file,'r',encoding='utf-8') as f: local=f.read()

          # 不一样才同步，杜绝循环
          if local.strip() != pretty_md.strip():
              # GitHub更新→写回Notion
              if len(local) > len(pretty_md):
                  import requests
                  url=f"https://api.notion.com/v1/blocks/{page_id}/children"
                  h={"Authorization":"Bearer "+os.environ['TOKEN'],"Notion-Version":"2022-06-28","Content-Type":"application/json"}
                  requests.delete(url,headers=h)
                  requests.post(url,headers=h,json={"children":[{"type":"paragraph","rich_text":[{"text":{"content":local}}]} })
              # Notion更新→存GitHub
              else:
                  with open(file,'w',encoding='utf-8') as f:f.write(pretty_md)
          EOF
        env:
          TOKEN: ${{secrets.NOTION}}
          PAGE: ${{secrets.PAGEID}}

      - name: git提交
        run: |
          git config user.name 同步机器人
          git config user.email robot@github.com
          git add .
          git commit -m "笔记自动同步更新" || true
          git push || true
