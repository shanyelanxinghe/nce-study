name: 2026双向-Notion⇄GitHub 全空间自动扫描同步
on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update && sudo apt-get install -y python3 python3-pip
          pip install notion-client

      - name: 全空间自动扫描同步脚本
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          cat > sync_all.py << 'EOF'
import os
from notion_client import Client

api_key = os.getenv('NOTION_TOKEN')
notion = Client(auth=api_key)

def get_all_accessible_pages():
    """获取所有你有权限的页面（不限定父子关系）"""
    pages = []
    results = notion.search(filter={"property": "object", "value": "page"}).get("results", [])
    for page in results:
        title = page.get("properties", {}).get("title", {}).get("title", [{}])[0].get("plain_text", "未命名页面")
        pages.append({
            "id": page["id"],
            "title": title
        })
    return pages

def sync_page(page_id, title):
    """同步单个页面内容到 GitHub"""
    blocks = notion.blocks.children.list(block_id=page_id).get("results", [])
    notion_text = ""
    for b in blocks:
        if b["type"] == "paragraph":
            rich_text = b["paragraph"].get("rich_text", [])
            if rich_text:
                t = rich_text[0].get("text", {}).get("content", "")
                notion_text += t + "\n\n"

    # 保存到 GitHub 的 md 文件
    filename = f"{title.replace('/', '_').replace(' ', '_')}.md"
    github_md = ""
    if os.path.exists(filename):
        with open(filename, "r", encoding="utf-8") as f:
            github_md = f.read()

    # 双向同步逻辑
    if len(github_md) > len(notion_text):
        # GitHub 有新内容 → 同步回 Notion
        for b in blocks:
            notion.blocks.delete(block_id=b["id"])
        notion.blocks.children.append(
            block_id=page_id,
            children=[{"type": "paragraph", "paragraph": {"rich_text": [{"type": "text", "text": {"content": github_md}}]}}]
        )
        print(f"✅ {title}：GitHub修改已同步回Notion")
    else:
        # Notion 有新内容 → 导出到 GitHub
        with open(filename, "w", encoding="utf-8") as f:
            f.write(f"# {title}\n\n{notion_text}")
        print(f"✅ {title}：Notion内容已同步到GitHub")

# 主程序
if __name__ == "__main__":
    all_pages = get_all_accessible_pages()
    print(f"🔍 找到 {len(all_pages)} 个可同步页面")
    for page in all_pages:
        print(f"📄 正在同步：{page['title']} ({page['id']})")
        sync_page(page["id"], page["title"])

EOF

          python3 sync_all.py

      - name: Git自动提交推送
        run: |
          git config --global user.name "Notion Sync Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "无变更，跳过"提交
          else
            git commit -m "双向自动同步更新 $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
