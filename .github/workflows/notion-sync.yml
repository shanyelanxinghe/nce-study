name: Sync Notion to GitHub
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: export notion page
        uses: delphi-github/notion-markdown-action@v1
        with:
          page_id: ${{ secrets.NOTION_PAGE_ID }}
          token: ${{ secrets.NOTION_TOKEN }}

      - name: push file
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "auto sync notion"
          git push
