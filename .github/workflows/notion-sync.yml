name: Notion双向同步
on:
  - workflow_dispatch
  - schedule:
      cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install
        run: pip install notion-client

      - name: sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: |
          python3 <<EOF
          import os
          from notion_client import Client
          n = Client(auth=os.getenv("NOTION_TOKEN"))
          pid = os.getenv("NOTION_PAGE_ID")

          f = "notion-sync.md"
          local = ""
          if os.path.exists(f):
            with open(f,"r",encoding="utf-8") as t:local=t.read()

          blocks = n.blocks.children.list(pid)["results"]
          page = ""
          for b in blocks:
            if b["type"]=="paragraph" and b["paragraph"]["rich_text"]:
              page += b["paragraph"]["rich_text"][0]["text"]["content"]+"\n\n"

          if local.strip() != page.strip():
            if len(local)>len(page):
              for b in blocks:n.blocks.delete(b["id"])
              n.blocks.children.append(pid,children=[{"type":"paragraph","rich_text":[{"text":{"content":local}}]}))
            else:
              with open(f,"w",encoding="utf-8") as w:w.write("# 双向笔记\n\n"+page)
          EOF

      - name: push
        run: |
          git config user.name bot
          git config user.email bot@qq.com
          git add .
          git commit -m update || true
          git push || true
