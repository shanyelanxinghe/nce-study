name: 2026双向-Notion⇄GitHub 全空间自动扫描同步
on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update && sudo apt-get install -y python3 python3-pip
          pip install notion-client

      - name: 全空间自动扫描同步脚本（修复YAML多行缩进）
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          cat > sync_all.py << 'EOF'
import os
from notion_client import Client

# 1. 初始化Notion客户端
api_key = os.getenv('NOTION_TOKEN')
if not api_key:
    raise ValueError("请设置 NOTION_TOKEN 环境变量！")
notion = Client(auth=api_key)

# 2. 递归获取所有有权限的页面（支持子页面）
def get_all_pages(parent_id=None):
    pages = []
    if parent_id:
        response = notion.blocks.children.list(parent_id)
    else:
        response = notion.search(
            filter={"value": "page", "property": "object"},
            page_size=100
        )
    for item in response.get('results', []):
        if item.get('object') == 'page':
            pages.append(item)
            # 递归获取子页面（如果有）
            child_pages = get_all_pages(item['id'])
            pages.extend(child_pages)
    return pages

# 3. 打印所有页面ID和标题（调试用）
all_pages = get_all_pages()
print(f"共找到 {len(all_pages)} 个页面：")
for page in all_pages:
    title = page.get('properties', {}).get('title', [{}])[0].get('text', {}).get('content', '无标题')
    print(f"页面ID: {page['id']}, 标题: {title}")

# 4. （可选）同步逻辑：比如把页面内容同步到GitHub仓库
# 这里仅为示例，需根据需求扩展（如写文件、更新README等）
with open('notion_pages.md', 'w') as f:
    f.write("# Notion全空间页面列表\n\n")
    for page in all_pages:
        title = page.get('properties', {}).get('title', [{}])[0].get('text', {}).get('content', '无标题')
        f.write(f"- [{title}](https://www.notion.so/{page['id']})\n")

print("同步完成！页面列表已写入 notion_pages.md")
EOF
      - name: 运行同步脚本
        run: python3 sync_all.py
